[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mirad"
version = "0.1.0"
description = "Trustworthy CV integrity assurance — Security / Trust subsystem (PS 26228)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["mirad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
