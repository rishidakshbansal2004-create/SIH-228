services:
  - type: web
    name: sih-228
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run trustcv_dataset_security/trustcv_final.py --server.address 0.0.0.0 --server.port $PORT --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
